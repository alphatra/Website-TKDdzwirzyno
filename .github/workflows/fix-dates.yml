name: Fix Post Dates

on:
  workflow_dispatch:

jobs:
  fix-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run fix on server via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Copy files to server
          scp scripts/fix_dates.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fix_dates.sh"
          scp "static/Posts - Arkusz1.csv" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/posts.csv"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x /tmp/fix_dates.sh"

          # Run — script reads credentials from /var/www/tkd-dzwirzyno/.env on the server
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "/tmp/fix_dates.sh '/tmp/posts.csv'"
